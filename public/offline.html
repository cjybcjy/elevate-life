<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <title>家庭账本离线</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f3ec;
        color: #111827;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #111827;
          color: #f9fafb;
        }
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        max-width: 420px;
        text-align: center;
      }

      img {
        width: 96px;
        height: 96px;
        border-radius: 24px;
      }

      h1 {
        margin: 20px 0 8px;
        font-size: 24px;
      }

      p {
        margin: 0;
        line-height: 1.7;
        color: #6b7280;
      }

      @media (prefers-color-scheme: dark) {
        p {
          color: #d1d5db;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>暂时无法连接家庭账本</h1>
      <p>为保护财务数据，离线模式只显示这个提示页。请恢复网络后重新打开应用。</p>
    </main>
  </body>
</html>
