<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Elevate Life</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #0f172a;
        color: #f8fafc;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px;
        background:
          linear-gradient(135deg, rgba(20, 184, 166, 0.16), transparent 36%),
          #0f172a;
      }

      main {
        width: min(100%, 420px);
        border: 1px solid rgba(148, 163, 184, 0.22);
        border-radius: 14px;
        padding: 24px;
        background: rgba(15, 23, 42, 0.82);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.24);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 24px;
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: #cbd5e1;
        font-size: 14px;
        line-height: 1.7;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 22px;
      }

      a {
        color: #5eead4;
        text-decoration: none;
        font-size: 14px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Elevate Life</h1>
      <p>
        这个移动壳需要连接到线上服务。请确认已经配置真实 HTTPS 域名，并在构建前设置
        CAPACITOR_SERVER_URL。
      </p>
      <nav aria-label="合规链接">
        <a href="/support">支持与帮助</a>
        <a href="/privacy">隐私政策</a>
      </nav>
    </main>
  </body>
</html>
