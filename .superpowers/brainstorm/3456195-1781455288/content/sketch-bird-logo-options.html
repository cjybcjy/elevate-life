<h2>基于你的简笔画生成的备选项</h2>
<p class="subtitle">这版只围绕你画的小鸟做美化，不再硬塞家庭、账本或财务隐喻。</p>

<div class="mockup">
  <div class="mockup-header">Bird logo exploration from your sketch</div>
  <div class="mockup-body" style="display:flex;align-items:center;justify-content:center;background:#f7f7f7;padding:24px;">
    <img src="/files/sketch-bird-logo-options.png" alt="Bird logo options generated from sketch" style="display:block;width:min(100%,920px);height:auto;border-radius:18px;box-shadow:0 18px 48px rgba(0,0,0,.12);" />
  </div>
</div>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>最接近手稿</h3>
      <p>保留手绘线条和原始性格，适合继续做轻量 monoline logo。</p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>柔和 App 图标</h3>
      <p>颜色舒服，轮廓成熟，比较适合作为产品 icon 的基础。</p>
    </div>
  </div>
  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>温暖线稿</h3>
      <p>亲切、轻快，但后续需要收紧线条和比例。</p>
    </div>
  </div>
  <div class="option" data-choice="d" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>强识别剪影</h3>
      <p>小尺寸最醒目，适合做深色 logo 或 favicon 方向。</p>
    </div>
  </div>
</div>
